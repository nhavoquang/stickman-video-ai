name: Tạo video người que

on:
  # Mỗi lần commit lên main: tự chạy 1 video mẫu tiếng Việt (chủ đề lấy từ topics.txt)
  push:
    branches: [main]
    paths-ignore: ["README.md", "music/**"]
  # Chạy tay trên web: chọn đầy đủ tuỳ chọn
  workflow_dispatch:
    inputs:
      topic:
        description: "Chủ đề video"
        required: true
      engine:
        description: "Ai viết và tối ưu: claude (nhiều vòng, dùng tài khoản Claude) hoặc gemini (nhanh)"
        type: choice
        options: [claude, gemini]
        default: claude
      language:
        description: "Ngôn ngữ (vi Việt, en Anh, ja Nhật, ko Hàn, zh Trung, th Thái, id Indo, es, fr, de, pt, hi)"
        type: choice
        options: [vi, en, ja, ko, zh, th, id, es, fr, de, pt, hi]
        default: vi
      aspect:
        description: "Khung hình: 16:9 ngang (YouTube/laptop), 9:16 dọc (Shorts/TikTok/Reels), 1:1 vuông"
        type: choice
        options: ["16:9", "9:16", "1:1"]
        default: "16:9"
      duration:
        description: "Độ dài khoảng (giây). Shorts nên 30-60"
        type: choice
        options: ["30", "45", "60", "90", "120", "180", "300", "600"]
        default: "60"
      voice:
        description: "Giọng đọc"
        type: choice
        options: [nu, nam]
        default: nu
      style:
        description: "Kiểu video: motion = hoạt hình chuyển động chuyên nghiệp, doodle/shirt = người que cũ"
        type: choice
        options: [motion, doodle, shirt]
        default: motion
      rate:
        description: "Tốc độ đọc (vd -10%, +0%, +15%)"
        default: "+5%"
      subtitles:
        description: "Phụ đề"
        type: choice
        options: ["on", "off"]
        default: "on"
      notes:
        description: "Yêu cầu thêm cho kịch bản (vd: hài hước, cho trẻ em, có số liệu) - có thể bỏ trống"
        required: false
        default: ""

jobs:
  # Claude Code Action không chạy trực tiếp với sự kiện push, nên khi commit
  # job này tự bấm "Run workflow" với tuỳ chọn mặc định (tiếng Việt, 16:9, 60 giây).
  sample-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Chạy 1 video mẫu tiếng Việt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOPIC=$(grep -v '^#' topics.txt | sed '/^\s*$/d' | shuf -n 1)
          echo "Chủ đề: $TOPIC"
          gh workflow run make-video.yml --ref "${{ github.ref_name }}" -f topic="$TOPIC" -f language=vi

  video:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      INPUT_TOPIC: ${{ inputs.topic || '' }}
      LANGUAGE: ${{ inputs.language || 'vi' }}
      ASPECT: ${{ inputs.aspect || '16:9' }}
      DURATION: ${{ inputs.duration || '60' }}
      VOICE: ${{ inputs.voice || 'nu' }}
      STYLE: ${{ inputs.style || 'motion' }}
      RATE: ${{ inputs.rate || '+5%' }}
      SUBTITLES: ${{ inputs.subtitles || 'on' }}
      NOTES: ${{ inputs.notes || '' }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài ffmpeg, cairo và font đa ngôn ngữ
        timeout-minutes: 15
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libcairo2-dev pkg-config python3-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: Ghi yêu cầu
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os, random
          keys = ["topic", "language", "aspect", "duration", "voice", "style", "rate", "subtitles", "notes"]
          req = {k: os.environ["INPUT_TOPIC" if k == "topic" else k.upper()] for k in keys}
          if not req["topic"].strip():  # chạy do commit: lấy ngẫu nhiên 1 chủ đề trong topics.txt
              topics = [t.strip() for t in open("topics.txt", encoding="utf-8") if t.strip() and not t.startswith("#")]
              req["topic"] = random.choice(topics)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"TOPIC={req['topic']}\n")
          json.dump(req, open("output/request.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(req)
          PY

      - name: Claude viết kịch bản và tối ưu nhiều vòng
        if: (inputs.engine || 'claude') == 'claude'
        id: claude
        continue-on-error: true
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # cho phép lần chạy mẫu do commit tự kích hoạt (người chạy là bot github-actions)
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: "Đọc file prompts/claude_director.md và làm đúng theo hướng dẫn trong đó. Yêu cầu video nằm trong output/request.json."
          claude_args: |
            --max-turns 120
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Dựng video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          COMMON=(--language "$LANGUAGE" --aspect "$ASPECT" --duration "$DURATION" --voice "$VOICE"
                  --style "$STYLE" --rate="$RATE" --subtitles "$SUBTITLES")
          if [ -f output/script.json ] && python -c "import json;json.load(open('output/script.json'))"; then
            echo "Dùng kịch bản Claude đã tối ưu"
            python src/main.py --script-file output/script.json "${COMMON[@]}" \
              || python src/main.py --topic "$TOPIC" --notes="$NOTES" "${COMMON[@]}"
          else
            echo "Không có kịch bản Claude, dùng Gemini"
            python src/main.py --topic "$TOPIC" --notes="$NOTES" "${COMMON[@]}"
          fi

      - name: Tải video về
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
            output/review_notes.md
            output/review/*.jpg
          retention-days: 14
