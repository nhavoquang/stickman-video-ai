name: Tạo video người que

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Chủ đề video"
        required: true
      scenes:
        description: "Số cảnh (8 cảnh ≈ 1-1,5 phút)"
        default: "8"
      voice:
        description: "Giọng đọc"
        type: choice
        options: [nu, nam]
        default: nu
      rate:
        description: "Tốc độ đọc"
        default: "+5%"

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài ffmpeg và font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Tạo video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >
          python src/main.py
          --topic "${{ inputs.topic }}"
          --scenes "${{ inputs.scenes }}"
          --voice "${{ inputs.voice }}"
          --rate "${{ inputs.rate }}"
      - name: Tải video về
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          retention-days: 14
